spring:
  datasource:
    url: jdbc:h2:mem:pkuih-migration-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration/{vendor}

app:
  demo-code: "888888"
  cors:
    allowed-origins: "http://localhost:5173"

logging:
  level:
    org.springframework.security: WARN
