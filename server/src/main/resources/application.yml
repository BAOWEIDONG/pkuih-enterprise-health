server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 7d
      cookie:
        name: PKUIH_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: pkuih-enterprise-health-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/pkuih;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

app:
  demo-code: ${DEMO_SMS_CODE:888888}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    org.springframework.security: INFO
